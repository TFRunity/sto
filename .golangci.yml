# golangci-lint v2 (ADR-014). Запускается по модулю из Makefile: make lint [MODULE=…]
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint
    - bodyclose
    - noctx
    - exhaustive
    - nilerr
  # gosec не включён — шум (ADR-014).
  exclusions:
    # Сгенерированный код (sqlc, oapi-codegen) — по заголовку
    # "// Code generated … DO NOT EDIT."
    generated: strict
