# Публичный контракт API v1 (ADR-028). Одна спецификация на все сервисы:
# каждый сервис генерирует strict-сервер из своей части по тегу (oapi-codegen.yaml).
openapi: 3.0.3

info:
  title: STO API
  version: 0.1.0
  description: |
    Публичные запросы идут через nginx → Gateway (`/api/…`); Gateway снимает префикс
    `/api` и проксирует в сервис по префиксу пути (ADR-022, ADR-038).
    Orders обращается к Inventory напрямую, без префикса `/api`.
    Проверка владельца ТС тоже выполняется напрямую, через внутренний маршрут Vehicle.

    Ошибки — единый конверт `Error` (ADR-032). Клиенты ветвятся только по
    `error.code`; `message` — для разработчика, не для показа.

    Деньги — строкой (`"1500.50"`), идентификаторы — UUID (ADR-026).

servers:
  - url: /api

tags:
  - name: users
    description: Регистрация и вход (сервис Users)
  - name: orders
    description: Заказы и их товарные позиции (сервис Orders)
  - name: inventory
    description: Чтение цены товара (сервис Inventory)
  - name: vehicle
    description: Добавление ТС и чтение карточки (сервис Vehicle)

# По умолчанию эндпоинт закрыт JWT; публичные явно ставят `security: []`.
security:
  - bearerAuth: []

paths:
  /dashboard:
    get:
      tags: [gateway]
      operationId: getDashboard
      summary: Сводка директора
      responses:
        '200':
          description: Данные получены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectorDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`upstream_error` — источник недоступен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: '`upstream_timeout` — истёк общий дедлайн'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /director/orders:
    get:
      tags: [gateway]
      operationId: listDirectorOrders
      summary: Поиск заказов директора
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [requested, active, paid, cancelled, awaiting_payment]
        - name: q
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
      responses:
        '200':
          description: Данные получены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectorOrderPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`search_too_broad` — уточните запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`upstream_error` — источник недоступен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: '`upstream_timeout` — истёк общий дедлайн'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/stats:
    get:
      tags: [orders]
      operationId: getOrderStats
      summary: Метрики и последние заказы
      security: []
      responses:
        '200':
          description: Данные получены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatsSource'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /internal/orders:
    get:
      tags: [orders]
      operationId: listOrdersForDirector
      summary: Страница заказов для Gateway
      security: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [requested, active, paid, cancelled, awaiting_payment]
        - name: client_ids
          in: query
          schema:
            type: array
            maxItems: 200
            items:
              type: string
              format: uuid
        - name: vehicle_ids
          in: query
          schema:
            type: array
            maxItems: 200
            items:
              type: string
              format: uuid
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
      responses:
        '200':
          description: Данные получены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectorOrderPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /director/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [gateway]
      operationId: getDirectorOrder
      summary: Карточка заказа для директора
      responses:
        '200':
          description: Заказ с историческими ценами и связанными данными.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectorOrderDetails'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /me:
    get:
      tags: [users]
      operationId: getMyProfile
      summary: Профиль текущего пользователя
      responses:
        '200':
          description: Собственный профиль.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
    patch:
      tags: [users]
      operationId: updateMyNotifications
      summary: Изменить настройку уведомлений текущего пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notifications_enabled]
              additionalProperties: false
              properties:
                notifications_enabled:
                  type: boolean
      responses:
        '200':
          description: Профиль с сохранённой настройкой.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /users/engineers-load:
    get:
      tags: [users]
      operationId: listEngineersForLoad
      summary: Живые инженеры для сводки нагрузки
      security: []
      responses:
        '200':
          description: Данные получены
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonSummary'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /users/search:
    get:
      tags: [users]
      operationId: searchClients
      summary: Поиск клиентов по имени или телефону
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 200
      responses:
        '200':
          description: Данные получены
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '422':
          description: '`search_too_broad` — уточните запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /users:
    get:
      tags: [users]
      operationId: getPeopleByIDs
      summary: Краткие данные пользователей, включая удалённых
      security: []
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: array
            minItems: 1
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: Данные получены
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /internal/vehicles/search:
    get:
      tags: [vehicle]
      operationId: searchVehicles
      summary: Поиск ТС по номеру
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 200
      responses:
        '200':
          description: Данные получены
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '422':
          description: '`search_too_broad` — уточните запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /internal/vehicles:
    get:
      tags: [vehicle]
      operationId: getVehiclesByIDs
      summary: Номера ТС, включая удалённые
      security: []
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: array
            minItems: 1
            maxItems: 200
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: Данные получены
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /register:
    post:
      tags: [users]
      operationId: register
      summary: Регистрация клиента
      description: |
        Всегда создаёт роль `client` (ADR-019); инженер и директор заводятся
        в БД. Сразу выдаёт токен, как вход (`sequence-register`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Клиент создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: '`phone_taken` — телефон уже занят среди живых пользователей (ADR-033)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /login:
    post:
      tags: [users]
      operationId: login
      summary: Вход по телефону и паролю
      description: |
        Неизвестный телефон и неверный пароль неразличимы ни по ответу, ни по
        времени (ADR-023). Токен — JWT HS256 на 7 дней, без refresh.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: '`invalid_credentials` — телефон или пароль не подходят'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /engineer/orders:
    get:
      tags: [orders, gateway]
      operationId: listEngineerOrders
      summary: Заказы ответственного инженера
      description: |
        Инженер определяется по доверенной идентичности. Активные включают active
        и paid до выдачи. Завершённые включают cancelled и paid после выдачи.
        Заказы выдаются от новых к старым. Пул заявок остаётся на GET /orders?status=requested.
        Gateway подставляет марку и номер ТС, если карточка найдена.
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [active, completed]
      responses:
        '200':
          $ref: '#/components/responses/OrderHistory'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /engineer/clients:
    get:
      tags: [users]
      operationId: searchActiveClients
      summary: Подобрать зарегистрированного клиента для прямого приёма
      description: Инженеру доступны действующие клиенты. Поиск по имени или телефону.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 200
      responses:
        '200':
          description: Подходящие клиенты. При отсутствии совпадений возвращается пустой массив.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '422':
          description: '`search_too_broad` — уточните запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /engineer/vehicles:
    get:
      tags: [vehicle]
      operationId: findVehicleForIntake
      summary: Найти действующее ТС по введённому госномеру
      description: Поиск инженера по точному номеру после нормализации Vehicle.
      parameters:
        - name: number
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 32
      responses:
        '200':
          description: Найденное ТС и его владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeVehicle'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [vehicle]
      operationId: createVehicleForIntake
      summary: Добавить ТС при прямом приёме
      description: Инженер выбирает действующего клиента. ТС сохраняется за выбранным владельцем.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntakeVehicleRequest'
      responses:
        '201':
          description: ТС добавлено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeVehicle'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: '`plate_taken` — нормализованный номер уже занят'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Общий пул заявок или история клиента
      description: |
        Инженер запрашивает общий пул через status=requested. Заявки выдаются
        от старых к новым.
        Клиент запрашивает свою историю через client_id=me. Orders берёт ID
        клиента из доверенной идентичности. История включает отменённые заказы
        и выдаётся от новых к старым. Необязательный vehicle_id ограничивает
        историю выбранным ТС клиента.
        Нужно указать ровно один из фильтров status и client_id. Параметр
        vehicle_id применяется только к истории клиента.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [requested]
            x-enum-varnames: [ListOrdersParamsStatusRequested]
        - name: client_id
          in: query
          schema:
            type: string
            enum: [me]
        - name: vehicle_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Пул заявок или история клиента. Если записей нет, возвращается пустой массив.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/ServiceBookingListItem'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OrderHistoryItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`forbidden` — роль не позволяет читать выбранный список'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [orders]
      operationId: createOrder
      summary: Записаться на сервис или создать активный заказ
      description: |
        Клиент создаёт заявку в статусе requested для своего ТС. Orders берёт
        client_id из доверенной идентичности и оставляет заказ без ответственного.
        Инженер создаёт заказ в статусе active для указанного клиента и назначается
        ответственным. Выбранное ТС принадлежит указанному клиенту.
        Повтор запроса с тем же request_id и теми же данными возвращает исходный ID
        заказа. Ключ относится к инженеру, который создал заказ.
        Вариант тела запроса определяется ролью вызывающего.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
        '409':
          description: '`intake_request_conflict` — ключ уже использован с другим клиентом или ТС'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [orders]
      operationId: getOrder
      summary: Карточка заказа
      description: Клиент читает свой заказ. Ответственный и исполнители читают свою карточку. Для инженера ответ содержит исполнителей и признак права изменения.
      responses:
        '200':
          description: Заказ с позициями и итоговой суммой
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}/vehicle-history:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [orders]
      operationId: listVehicleHistoryForEngineer
      summary: История ТС из текущего заказа инженера
      description: |
        ID относится к текущему заказу. История доступна его ответственному,
        пока заказ активен либо оплачен и ожидает выдачи. Orders определяет
        машину по текущему заказу и возвращает все её остальные заказы
        от новых к старым, включая заказы других инженеров.
      responses:
        '200':
          $ref: '#/components/responses/OrderHistory'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}/vehicle-history/{historical_id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: historical_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [orders]
      operationId: getHistoricalOrderForEngineer
      summary: Карточка заказа из истории ТС
      description: Orders заново проверяет доступ по текущему заказу и принадлежность исторического заказа тому же ТС.
      responses:
        '200':
          description: Историческая карточка заказа в режиме просмотра.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}/claim:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    patch:
      tags: [orders]
      operationId: claimOrder
      summary: Взять заявку в работу
      description: |
        Доступно инженеру. Переводит заявку в active и назначает текущего
        инженера ответственным. При повторном назначении активного заказа
        последний инженер становится ответственным, прежние исполнители сохраняются.
      responses:
        '200':
          description: Заказ взят в работу
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          description: '`order_not_claimable` — заказ оплачен или отменён'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}/stage:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    patch:
      tags: [orders]
      operationId: changeOrderStage
      summary: Изменить этап работ
      description: Доступно ответственному за заказ инженеру.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOrderStageRequest'
      responses:
        '200':
          description: Этап изменён
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`order_not_found` — заказ не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`order_not_paid` — выдача требует подтверждённой оплаты и завершённого списания'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    patch:
      tags: [orders]
      operationId: cancelOrder
      summary: Отменить заказ
      description: Ответственный может отменить активный заказ.
      responses:
        '200':
          description: Заказ отменён
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`order_not_found` — заказ не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`order_not_cancellable` — статус заказа не допускает отмену'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}/services:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [orders]
      operationId: addOrderService
      summary: Добавить услугу по текущей цене каталога
      description: Доступно ответственному за активный заказ инженеру.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrderServiceRequest'
      responses:
        '201':
          description: Услуга добавлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderService'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`order_not_found` или `service_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`order_not_editable` — заказ не в работе'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`upstream_error` — Services недоступен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}/items:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [orders]
      operationId: addOrderItem
      summary: Добавление товарной позиции
      description: Доступно ответственному за активный заказ. Название и цена запрашиваются в Inventory и сохраняются в позиции.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrderItemRequest'
      responses:
        '201':
          description: Позиция добавлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          description: '`order_not_found` или `item_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`order_not_editable` — заказ не в работе'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`upstream_error` — Inventory недоступен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}/pay:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [orders]
      operationId: payOrder
      summary: Отметить свой заказ оплаченным
      responses:
        '200':
          description: Оплата подтверждена. Повтор возвращает исходное время отметки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkOrderPaidResponse'
        '409':
          description: Заказ недоступен для оплаты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}/stock/retry:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [orders]
      operationId: retryOrderStock
      summary: Ответственный повторяет отклонённое списание по оплаченному заказу
      responses:
        '202':
          description: Новая попытка списания принята
        '409':
          description: '`stock_retry_unavailable` — списание нельзя повторить в текущем состоянии'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /certificates:
    get:
      tags: [orders]
      operationId: listClientCertificates
      summary: Справки об оплате текущего клиента
      description: |
        Справка появляется в списке после успешного списания. Повтор формирования
        отображается как processing. После последней неудачной попытки статус failed.
        Справки выдаются от новых к старым.
      responses:
        '200':
          description: Справки клиента. Если справок нет, возвращается пустой массив.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientCertificate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}/certificate:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [orders]
      operationId: getCertificate
      summary: Скачать готовую справку об оплате
      description: Клиент скачивает PDF по своему заказу. Директор может скачать PDF любого заказа.
      responses:
        '200':
          description: PDF-справка
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Справка отсутствует или ещё не готова (certificate_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /inventory:
    get:
      tags: [inventory]
      operationId: listItems
      summary: Список активных позиций каталога
      responses:
        '200':
          description: Каталог
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryEntry'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [inventory]
      operationId: createItem
      summary: Добавить товар
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryInput'
      responses:
        '201':
          description: Позиция создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryEntry'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /inventory/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [inventory]
      operationId: getItem
      summary: Имя и цена товара
      description: Внутренний HTTP-вызов Orders → Inventory.
      security: []
      responses:
        '200':
          description: Товар найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          description: '`item_not_found` — товар отсутствует или удалён'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

    put:
      tags: [inventory]
      operationId: updateItem
      summary: Заменить данные позиции
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryInput'
      responses:
        '200':
          description: Позиция обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryEntry'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`item_not_found` — товар не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags: [inventory]
      operationId: deleteItem
      summary: Удалить позицию из каталога
      responses:
        '204':
          description: Позиция удалена
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`item_not_found` — товар не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /services:
    get:
      tags: [services]
      operationId: listServices
      summary: Список активных позиций каталога
      description: Доступен клиенту для подсказок при записи, инженеру и директору.
      responses:
        '200':
          description: Каталог
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceEntry'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [services]
      operationId: createService
      summary: Добавить услугу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      responses:
        '201':
          description: Позиция создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceEntry'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /services/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [services]
      operationId: updateService
      summary: Заменить данные позиции
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      responses:
        '200':
          description: Позиция обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceEntry'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`service_not_found` — услуга не найдена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags: [services]
      operationId: deleteService
      summary: Удалить позицию из каталога
      responses:
        '204':
          description: Позиция удалена
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`service_not_found` — услуга не найдена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /internal/services/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [services]
      operationId: getService
      summary: Прочитать живую услугу по ID
      security: []
      responses:
        '200':
          description: Услуга найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceEntry'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          description: '`service_not_found` — услуга не найдена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /vehicles:
    get:
      tags: [vehicle]
      operationId: listClientVehicles
      summary: Список автомобилей текущего клиента
      description: |
        Возвращает действующие автомобили клиента, включая автомобили без заказов.
        Клиент определяется по авторизации. Список отсортирован от новых к старым.
      responses:
        '200':
          description: Автомобили клиента. Если автомобилей нет, возвращается пустой массив.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientVehicleListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступно только клиенту.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [vehicle]
      operationId: createVehicle
      summary: Добавить ТС для текущего клиента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleDetails'
      responses:
        '201':
          description: ТС добавлено
          content:
            application/json:
              schema:
                type: object
                required: [vehicle_id]
                properties:
                  vehicle_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: '`plate_taken` — нормализованный номер уже занят'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /vehicles/makes:
    get:
      tags: [vehicle]
      operationId: listVehicleMakes
      summary: Справочник марок автомобилей
      description: Доступен клиенту при добавлении автомобиля. Альтернативные написания используются для поиска.
      responses:
        '200':
          description: Действующие марки в алфавитном порядке.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleMake'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /vehicles/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [vehicle]
      operationId: getVehicle
      summary: Прочитать карточку ТС
      description: Владелец читает свою карточку, инженер открывает карточку по ID.
      responses:
        '200':
          description: Карточка ТС
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleCard'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`vehicle_not_found` — ТС отсутствует, удалено или недоступно клиенту'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /vehicles/{id}/cover_photo:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [vehicle]
      operationId: getVehicleCoverPhoto
      summary: Скачать обложку ТС
      description: Доступно владельцу ТС и инженеру.
      responses:
        '200':
          $ref: '#/components/responses/VehiclePhotoJPEG'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VehiclePhotoNotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    put:
      tags: [vehicle]
      operationId: replaceVehicleCoverPhoto
      summary: Заменить обложку своего ТС
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  $ref: '#/components/schemas/VehiclePhotoUpload'
      responses:
        '200':
          description: Обложка заменена
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
        '413':
          $ref: '#/components/responses/VehiclePhotoTooLarge'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /vehicles/{id}/photos:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [vehicle]
      operationId: addVehiclePhoto
      summary: Добавить снимок в галерею ТС
      description: Доступно инженеру. Снимок можно связать с заказом.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  $ref: '#/components/schemas/VehiclePhotoUpload'
                order_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Снимок добавлен
          content:
            application/json:
              schema:
                type: object
                required: [photo_id]
                properties:
                  photo_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
        '413':
          $ref: '#/components/responses/VehiclePhotoTooLarge'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /vehicles/{id}/photos/{photo_id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: photo_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [vehicle]
      operationId: getVehiclePhoto
      summary: Скачать снимок из галереи ТС
      description: Доступно владельцу ТС и инженеру. Снимок должен принадлежать указанному ТС.
      responses:
        '200':
          $ref: '#/components/responses/VehiclePhotoJPEG'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VehiclePhotoNotFound'
      default:
        $ref: '#/components/responses/UnexpectedError'

  /internal/vehicles/{id}/ownership:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [vehicle]
      operationId: checkVehicleOwnership
      summary: Проверить, принадлежит ли ТС указанному клиенту
      description: Внутренний HTTP-вызов Orders → Vehicle. Gateway этот маршрут не публикует.
      security: []
      parameters:
        - name: owner_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: ТС принадлежит клиенту
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Проверяется только в Gateway (ADR-010, ADR-023).

  responses:
    VehiclePhotoJPEG:
      description: Изображение JPEG
      content:
        image/jpeg:
          schema:
            type: string
            format: binary
    VehiclePhotoNotFound:
      description: '`photo_not_found` — фото или ТС отсутствует либо недоступно'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VehicleNotFound:
      description: '`vehicle_not_found` — ТС отсутствует, удалено или недоступно клиенту'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VehiclePhotoTooLarge:
      description: '`photo_too_large` — тело запроса превышает 3,5 МиБ'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: '`unauthorized` — не удалось установить идентичность запроса'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrderHistory:
      description: Заказы. Если записей нет, возвращается пустой массив.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrderHistoryItem'
    OrderNotFound:
      description: '`order_not_found` — заказ не найден'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: '`validation_failed` — ошибки входных данных; подробности в `error.fields`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnexpectedError:
      description: Прочие ошибки (`internal_error`, а у Gateway — `unauthorized`, `forbidden`, `upstream_error`, `upstream_timeout`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    VehiclePhotoLink:
      type: object
      required: [photo_id, url]
      properties:
        photo_id:
          type: string
          format: uuid
        url:
          type: string
          description: Путь к снимку через Gateway, относительно origin API.
          example: /api/vehicles/42dfbb24-832d-4b2b-8830-9564d4857019/photos/208298ad-189e-4534-b5b6-a05697ab2d09
    VehiclePhotoUpload:
      type: string
      format: binary
      description: Изображение JPEG или PNG. Vehicle определяет формат по содержимому.
    VehicleDetails:
      type: object
      required: [number, brand, vin]
      properties:
        number:
          type: string
          minLength: 1
        brand:
          type: string
          minLength: 1
        vin:
          type: string
          minLength: 1
    IntakeVehicle:
      type: object
      required: [vehicle_id, owner_id, number, brand]
      properties:
        vehicle_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        number:
          type: string
        brand:
          type: string
    CreateIntakeVehicleRequest:
      allOf:
        - $ref: '#/components/schemas/VehicleDetails'
        - type: object
          required: [owner_id]
          properties:
            owner_id:
              type: string
              format: uuid
    VehicleMake:
      type: object
      required: [name, aliases]
      properties:
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
    ClientVehicleListItem:
      type: object
      required: [vehicle_id, number, brand]
      properties:
        vehicle_id:
          type: string
          format: uuid
        number:
          type: string
        brand:
          type: string
    VehicleCard:
      allOf:
        - $ref: '#/components/schemas/VehicleDetails'
        - type: object
          required: [vehicle_id, photos]
          properties:
            vehicle_id:
              type: string
              format: uuid
            cover_photo_url:
              type: string
              description: Путь к обложке через Gateway, относительно origin API. Поле отсутствует, если обложки нет.
              example: /api/vehicles/42dfbb24-832d-4b2b-8830-9564d4857019/cover_photo
            photos:
              type: array
              description: Ссылки на снимки галереи. Пустой массив, если снимков нет.
              items:
                $ref: '#/components/schemas/VehiclePhotoLink'

    # ── общие ───────────────────────────────────────────────────────────
    Error:
      description: Конверт ошибки (ADR-032)
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Стабильная машиночитаемая строка (`phone_taken`, `validation_failed`, …)
          example: phone_taken
        message:
          type: string
          description: Для разработчика; не показывать пользователю
        fields:
          type: object
          description: Ошибки валидации «поле → причина» (ADR-028, P-13); только у `validation_failed`
          additionalProperties:
            type: string
          example:
            phone: required
            password: too_long

    # ── users ───────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [name, phone, password]
      additionalProperties: false
      properties:
        name:
          type: string
        phone:
          type: string
          description: Логин; уникален среди живых пользователей (ADR-033, А-03)
        password:
          type: string
          format: password
          description: Не длиннее 72 байт в UTF-8 — лимит bcrypt (ADR-023)

    RegisterResponse:
      type: object
      required: [user_id, token]
      properties:
        user_id:
          type: string
          format: uuid
        token:
          type: string
          description: JWT, как у `/login`

    LoginRequest:
      type: object
      required: [phone, password]
      additionalProperties: false
      properties:
        phone:
          type: string
        password:
          type: string
          format: password

    TokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: 'JWT HS256: `sub` = user_id, claim роли, `exp` — 7 дней'

    Money:
      type: string
      description: Сумма в рублях с двумя знаками после точки.
      pattern: '^[0-9]+[.][0-9]{2}$'
      example: "1500.50"
      x-go-type: decimal.Decimal
      x-go-type-import:
        path: github.com/shopspring/decimal
        name: decimal

    CreateOrderRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateEngineerOrderRequest'
        - $ref: '#/components/schemas/CreateServiceBookingRequest'

    CreateEngineerOrderRequest:
      description: Прямое создание активного заказа инженером.
      type: object
      required: [client_id, vehicle_id]
      additionalProperties: false
      properties:
        client_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
          description: Ключ попытки прямого приёма. Повтор с тем же ключом и данными возвращает ID созданного заказа.

    CreateServiceBookingRequest:
      description: Заявка клиента на сервис. Выбор услуги сохраняется как описание заявки.
      type: object
      required: [vehicle_id, service, date]
      additionalProperties: false
      properties:
        vehicle_id:
          type: string
          format: uuid
        service:
          type: string
          minLength: 1
          description: Название желаемой услуги для заявки.
        date:
          type: string
          format: date
          description: Желаемая дата визита без времени. Сегодня или позже по календарю Europe/Moscow.
        comment:
          type: string
          description: Дополнительная информация от клиента.

    ServiceBookingListItem:
      type: object
      required: [id, client_id, vehicle_id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [requested]
        service:
          type: string
        date:
          type: string
          format: date
        comment:
          type: string
        created_at:
          type: string
          format: date-time

    ClientCertificate:
      type: object
      required: [id, order_id, created_at, status]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/CertificateStatus'

    CertificateStatus:
      type: string
      enum: [processing, ready, failed]
      description: Формируется, готова к скачиванию или исчерпаны попытки формирования.

    OrderHistoryItem:
      type: object
      required: [id, vehicle_id, status, stage, payment_confirmed, created_at]
      properties:
        id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        vehicle_number:
          type: string
          description: Госномер ТС в списке инженера.
        vehicle_brand:
          type: string
          description: Марка ТС в списке инженера.
        status:
          type: string
          enum: [requested, active, paid, cancelled]
        stage:
          type: string
          enum: [принят, в_работе, готов, выдан]
        payment_confirmed:
          type: boolean
          description: Факт оплаты подтверждён. Для отметки v3 не зависит от списания.
        created_at:
          type: string
          format: date-time

    CreateOrderResponse:
      type: object
      required: [order_id]
      properties:
        order_id:
          type: string
          format: uuid

    AddOrderItemRequest:
      type: object
      required: [item_id, quantity]
      additionalProperties: false
      properties:
        item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1

    OrderItem:
      type: object
      required: [id, item_id, quantity, price]
      properties:
        id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        name:
          type: string
          description: Название товара на момент добавления позиции. Может отсутствовать у старых позиций.
        quantity:
          type: integer
          format: int32
          minimum: 1
        price:
          $ref: '#/components/schemas/Money'

    Order:
      type: object
      required: [id, client_id, vehicle_id, status, stage, items, services, total, payment_confirmed]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        engineer_id:
          type: string
          format: uuid
          description: Идентификатор назначенного инженера. У заявки может отсутствовать.
        engineers:
          type: array
          description: Исполнители заказа. Поле передаётся инженеру.
          items:
            $ref: '#/components/schemas/OrderEngineer'
        can_edit:
          type: boolean
          description: Текущий инженер может менять карточку. В исторической карточке значение false.
        certificate_status:
          $ref: '#/components/schemas/CertificateStatus'
        status:
          type: string
          enum: [requested, active, paid, cancelled]
        stage:
          type: string
          enum: [принят, в_работе, готов, выдан]
          x-enum-varnames: [StageAccepted, StageInProgress, StageReady, StageDelivered]
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        services:
          type: array
          items:
            $ref: '#/components/schemas/OrderService'
        total:
          $ref: '#/components/schemas/Money'
        payment_confirmed:
          type: boolean
          description: Факт оплаты подтверждён. Для отметки v3 не зависит от списания.
        stock_status:
          type: string
          enum: [pending, deducted, rejected]
          description: Состояние списания по оплаченному заказу. Может отсутствовать в ответе v1.

    OrderEngineer:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Имя из Users, когда оно доступно.

    MarkOrderPaidResponse:
      type: object
      required: [status, paid_at]
      properties:
        status:
          type: string
          enum: [paid]
        paid_at:
          type: string
          format: date-time

    ChangeOrderStageRequest:
      type: object
      required: [stage]
      properties:
        stage:
          type: string
          enum: [принят, в_работе, готов, выдан]

    AddOrderServiceRequest:
      type: object
      required: [service_id, quantity]
      properties:
        service_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647

    OrderService:
      type: object
      required: [id, service_id, name, price, quantity]
      properties:
        id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        name:
          type: string
        price:
          $ref: '#/components/schemas/CatalogPrice'
        quantity:
          type: integer
          format: int32

    CatalogPrice:
      type: string
      description: Цена в рублях с двумя знаками после точки.
      pattern: '^[0-9]{1,10}[.][0-9]{2}$'
      example: "1500.50"

    InventoryInput:
      type: object
      required: [name, price, quantity]
      properties:
        name:
          type: string
          minLength: 1
        price:
          $ref: '#/components/schemas/CatalogPrice'
        quantity:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647

    InventoryEntry:
      type: object
      required: [id, name, price, quantity]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        price:
          $ref: '#/components/schemas/CatalogPrice'
        quantity:
          type: integer
          format: int64
          minimum: 0

    ServiceInput:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 1
        price:
          $ref: '#/components/schemas/CatalogPrice'

    ServiceEntry:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        price:
          $ref: '#/components/schemas/CatalogPrice'

    PersonSummary:
      type: object
      required: [id, name, phone]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string

    VehicleSummary:
      type: object
      required: [id, number]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        brand:
          type: string
        vin:
          type: string

    DirectorOrderDetails:
      type: object
      required: [order]
      properties:
        order:
          $ref: '#/components/schemas/Order'
        client:
          $ref: '#/components/schemas/PersonSummary'
        vehicle:
          $ref: '#/components/schemas/VehicleSummary'

    MyProfile:
      type: object
      required: [name, phone, role, created_at, notifications_enabled]
      properties:
        name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [client, engineer, director]
        created_at:
          type: string
          format: date-time
        work_started_at:
          type: string
          format: date
        notifications_enabled:
          type: boolean

    DirectorOrder:
      type: object
      required: [id, client_id, vehicle_id, status, stage, created_at, total]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        engineer_id:
          type: string
          format: uuid
        client_name:
          type: string
        client_phone:
          type: string
        vehicle_number:
          type: string
        engineer_name:
          type: string
        status:
          type: string
        stage:
          type: string
        created_at:
          type: string
          format: date-time
        total:
          type: string

    DirectorOrderPage:
      type: object
      required: [orders, page, has_next]
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/DirectorOrder'
        page:
          type: integer
          format: int32
        has_next:
          type: boolean

    EngineerCount:
      type: object
      required: [id, active_orders]
      properties:
        id:
          type: string
          format: uuid
        active_orders:
          type: integer
          format: int64

    EngineerLoad:
      type: object
      required: [id, name, active_orders]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active_orders:
          type: integer
          format: int64

    OrderStats:
      type: object
      required: [today_orders, active_orders, awaiting_payment, today_revenue, recent_orders]
      properties:
        today_orders:
          type: integer
          format: int64
        active_orders:
          type: integer
          format: int64
        awaiting_payment:
          type: integer
          format: int64
        today_revenue:
          type: string
        recent_orders:
          type: array
          items:
            $ref: '#/components/schemas/DirectorOrder'

    OrderStatsSource:
      type: object
      required: [stats, assigned_counts]
      properties:
        stats:
          $ref: '#/components/schemas/OrderStats'
        assigned_counts:
          type: array
          items:
            $ref: '#/components/schemas/EngineerCount'

    DirectorDashboard:
      type: object
      required: [orders, engineers]
      properties:
        orders:
          $ref: '#/components/schemas/OrderStats'
        engineers:
          type: array
          items:
            $ref: '#/components/schemas/EngineerLoad'

    InventoryItem:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
