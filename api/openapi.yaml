# Публичный контракт API v1 (ADR-028). Одна спецификация на все сервисы:
# каждый сервис генерирует strict-сервер из своей части по тегу (oapi-codegen.yaml).
openapi: 3.0.3

info:
  title: STO API
  version: 0.1.0
  description: |
    Публичные запросы идут через nginx → Gateway (`/api/…`); Gateway снимает префикс
    `/api` и проксирует в сервис по префиксу пути (ADR-022, ADR-038).
    Orders обращается к Inventory напрямую, без префикса `/api`.
    Проверка владельца ТС тоже выполняется напрямую, через внутренний маршрут Vehicle.

    Ошибки — единый конверт `Error` (ADR-032). Клиенты ветвятся только по
    `error.code`; `message` — для разработчика, не для показа.

    Деньги — строкой (`"1500.50"`), идентификаторы — UUID (ADR-026).

servers:
  - url: /api

tags:
  - name: users
    description: Регистрация и вход (сервис Users)
  - name: orders
    description: Заказы и их товарные позиции (сервис Orders)
  - name: inventory
    description: Чтение цены товара (сервис Inventory)
  - name: vehicle
    description: Добавление ТС и чтение карточки (сервис Vehicle)

# По умолчанию эндпоинт закрыт JWT; публичные явно ставят `security: []`.
security:
  - bearerAuth: []

paths:
  /register:
    post:
      tags: [users]
      operationId: register
      summary: Регистрация клиента
      description: |
        Всегда создаёт роль `client` (ADR-019); инженер и директор заводятся
        в БД. Сразу выдаёт токен, как вход (`sequence-register`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Клиент создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: '`phone_taken` — телефон уже занят среди живых пользователей (ADR-033)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /login:
    post:
      tags: [users]
      operationId: login
      summary: Вход по телефону и паролю
      description: |
        Неизвестный телефон и неверный пароль неразличимы ни по ответу, ни по
        времени (ADR-023). Токен — JWT HS256 на 7 дней, без refresh.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: '`invalid_credentials` — телефон или пароль не подходят'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders:
    get:
      tags: [orders]
      operationId: listServiceBookings
      summary: Список заявок на сервис для инженера
      description: Общий пул заявок всех клиентов в порядке от старых к новым.
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [requested]
      responses:
        '200':
          description: Заявки в статусе requested. Если заявок нет, возвращается пустой массив.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceBookingListItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [orders]
      operationId: createOrder
      summary: Записаться на сервис или создать активный заказ
      description: |
        Клиент создаёт заявку в статусе requested для своего ТС. Orders берёт
        client_id из доверенной идентичности и оставляет заказ без ответственного.
        Инженер создаёт заказ в статусе active для указанного клиента и назначается
        ответственным. Вариант тела запроса определяется ролью вызывающего.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [orders]
      operationId: getOrder
      summary: Карточка заказа
      responses:
        '200':
          description: Заказ с позициями и итоговой суммой
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}/items:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [orders]
      operationId: addOrderItem
      summary: Добавление товарной позиции
      description: Цена запрашивается в Inventory и сохраняется в позиции.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrderItemRequest'
      responses:
        '201':
          description: Позиция добавлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          description: '`order_not_found` или `item_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`upstream_error` — Inventory недоступен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}/pay:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [orders]
      operationId: payOrder
      summary: Начать оплату заказа клиента
      responses:
        '202':
          description: Оплата принята в обработку
        '409':
          description: Заказ недоступен для оплаты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /orders/{id}/certificate:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [orders]
      operationId: getCertificate
      summary: Скачать готовую справку об оплате
      responses:
        '200':
          description: PDF-справка
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Справка отсутствует или ещё не готова (certificate_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /inventory/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [inventory]
      operationId: getItem
      summary: Имя и цена товара
      description: Внутренний HTTP-вызов Orders → Inventory.
      security: []
      responses:
        '200':
          description: Товар найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          description: '`item_not_found` — товар отсутствует или удалён'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /vehicles:
    post:
      tags: [vehicle]
      operationId: createVehicle
      summary: Добавить ТС для текущего клиента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleDetails'
      responses:
        '201':
          description: ТС добавлено
          content:
            application/json:
              schema:
                type: object
                required: [vehicle_id]
                properties:
                  vehicle_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: '`plate_taken` — нормализованный номер уже занят'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /vehicles/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [vehicle]
      operationId: getVehicle
      summary: Прочитать карточку ТС
      description: Владелец читает свою карточку, инженер открывает карточку по ID.
      responses:
        '200':
          description: Карточка ТС
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleCard'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`vehicle_not_found` — ТС отсутствует, удалено или недоступно клиенту'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /vehicles/{id}/cover_photo:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [vehicle]
      operationId: getVehicleCoverPhoto
      summary: Скачать обложку ТС
      description: Доступно владельцу ТС и инженеру.
      responses:
        '200':
          $ref: '#/components/responses/VehiclePhotoJPEG'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VehiclePhotoNotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    put:
      tags: [vehicle]
      operationId: replaceVehicleCoverPhoto
      summary: Заменить обложку своего ТС
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  $ref: '#/components/schemas/VehiclePhotoUpload'
      responses:
        '200':
          description: Обложка заменена
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
        '413':
          $ref: '#/components/responses/VehiclePhotoTooLarge'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /vehicles/{id}/photos:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [vehicle]
      operationId: addVehiclePhoto
      summary: Добавить снимок в галерею ТС
      description: Доступно инженеру. Снимок можно связать с заказом.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  $ref: '#/components/schemas/VehiclePhotoUpload'
                order_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Снимок добавлен
          content:
            application/json:
              schema:
                type: object
                required: [photo_id]
                properties:
                  photo_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
        '413':
          $ref: '#/components/responses/VehiclePhotoTooLarge'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /vehicles/{id}/photos/{photo_id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: photo_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [vehicle]
      operationId: getVehiclePhoto
      summary: Скачать снимок из галереи ТС
      description: Доступно владельцу ТС и инженеру. Снимок должен принадлежать указанному ТС.
      responses:
        '200':
          $ref: '#/components/responses/VehiclePhotoJPEG'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VehiclePhotoNotFound'
      default:
        $ref: '#/components/responses/UnexpectedError'

  /internal/vehicles/{id}/ownership:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [vehicle]
      operationId: checkVehicleOwnership
      summary: Проверить, принадлежит ли ТС указанному клиенту
      description: Внутренний HTTP-вызов Orders → Vehicle. Gateway этот маршрут не публикует.
      security: []
      parameters:
        - name: owner_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: ТС принадлежит клиенту
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Проверяется только в Gateway (ADR-010, ADR-023).

  responses:
    VehiclePhotoJPEG:
      description: Изображение JPEG
      content:
        image/jpeg:
          schema:
            type: string
            format: binary
    VehiclePhotoNotFound:
      description: '`photo_not_found` — фото или ТС отсутствует либо недоступно'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VehicleNotFound:
      description: '`vehicle_not_found` — ТС отсутствует, удалено или недоступно клиенту'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VehiclePhotoTooLarge:
      description: '`photo_too_large` — тело запроса превышает 3,5 МиБ'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: '`unauthorized` — не удалось установить идентичность запроса'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrderNotFound:
      description: '`order_not_found` — заказ не найден'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: '`validation_failed` — ошибки входных данных; подробности в `error.fields`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnexpectedError:
      description: Прочие ошибки (`internal_error`, а у Gateway — `unauthorized`, `forbidden`, `upstream_error`, `upstream_timeout`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    VehiclePhotoLink:
      type: object
      required: [photo_id, url]
      properties:
        photo_id:
          type: string
          format: uuid
        url:
          type: string
          description: Путь к снимку через Gateway, относительно origin API.
          example: /api/vehicles/42dfbb24-832d-4b2b-8830-9564d4857019/photos/208298ad-189e-4534-b5b6-a05697ab2d09
    VehiclePhotoUpload:
      type: string
      format: binary
      description: Изображение JPEG или PNG. Vehicle определяет формат по содержимому.
    VehicleDetails:
      type: object
      required: [number, brand, vin]
      properties:
        number:
          type: string
          minLength: 1
        brand:
          type: string
          minLength: 1
        vin:
          type: string
          minLength: 1
    VehicleCard:
      allOf:
        - $ref: '#/components/schemas/VehicleDetails'
        - type: object
          required: [vehicle_id, photos]
          properties:
            vehicle_id:
              type: string
              format: uuid
            cover_photo_url:
              type: string
              description: Путь к обложке через Gateway, относительно origin API. Поле отсутствует, если обложки нет.
              example: /api/vehicles/42dfbb24-832d-4b2b-8830-9564d4857019/cover_photo
            photos:
              type: array
              description: Ссылки на снимки галереи. Пустой массив, если снимков нет.
              items:
                $ref: '#/components/schemas/VehiclePhotoLink'

    # ── общие ───────────────────────────────────────────────────────────
    Error:
      description: Конверт ошибки (ADR-032)
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Стабильная машиночитаемая строка (`phone_taken`, `validation_failed`, …)
          example: phone_taken
        message:
          type: string
          description: Для разработчика; не показывать пользователю
        fields:
          type: object
          description: Ошибки валидации «поле → причина» (ADR-028, P-13); только у `validation_failed`
          additionalProperties:
            type: string
          example:
            phone: required
            password: too_long

    # ── users ───────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [name, phone, password]
      additionalProperties: false
      properties:
        name:
          type: string
        phone:
          type: string
          description: Логин; уникален среди живых пользователей (ADR-033, А-03)
        password:
          type: string
          format: password
          description: Не длиннее 72 байт в UTF-8 — лимит bcrypt (ADR-023)

    RegisterResponse:
      type: object
      required: [user_id, token]
      properties:
        user_id:
          type: string
          format: uuid
        token:
          type: string
          description: JWT, как у `/login`

    LoginRequest:
      type: object
      required: [phone, password]
      additionalProperties: false
      properties:
        phone:
          type: string
        password:
          type: string
          format: password

    TokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: 'JWT HS256: `sub` = user_id, claim роли, `exp` — 7 дней'

    Money:
      type: string
      description: Сумма в рублях с двумя знаками после точки.
      pattern: '^[0-9]+[.][0-9]{2}$'
      example: "1500.50"
      x-go-type: decimal.Decimal
      x-go-type-import:
        path: github.com/shopspring/decimal
        name: decimal

    CreateOrderRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateEngineerOrderRequest'
        - $ref: '#/components/schemas/CreateServiceBookingRequest'

    CreateEngineerOrderRequest:
      description: Прямое создание активного заказа инженером.
      type: object
      required: [client_id, vehicle_id]
      additionalProperties: false
      properties:
        client_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid

    CreateServiceBookingRequest:
      description: Заявка клиента на сервис. Выбор услуги сохраняется как описание заявки.
      type: object
      required: [vehicle_id, service, date]
      additionalProperties: false
      properties:
        vehicle_id:
          type: string
          format: uuid
        service:
          type: string
          minLength: 1
          description: Название желаемой услуги для заявки.
        date:
          type: string
          format: date
          description: Желаемая дата визита без времени и часового пояса.
        comment:
          type: string
          description: Дополнительная информация от клиента.

    ServiceBookingListItem:
      type: object
      required: [id, client_id, vehicle_id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [requested]
        service:
          type: string
        date:
          type: string
          format: date
        comment:
          type: string
        created_at:
          type: string
          format: date-time

    CreateOrderResponse:
      type: object
      required: [order_id]
      properties:
        order_id:
          type: string
          format: uuid

    AddOrderItemRequest:
      type: object
      required: [item_id, quantity]
      additionalProperties: false
      properties:
        item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1

    OrderItem:
      type: object
      required: [id, item_id, quantity, price]
      properties:
        id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
        price:
          $ref: '#/components/schemas/Money'

    Order:
      type: object
      required: [id, client_id, vehicle_id, status, stage, items, total, payment_confirmed]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        engineer_id:
          type: string
          format: uuid
          description: Идентификатор назначенного инженера. У заявки может отсутствовать.
        status:
          type: string
          enum: [requested, active, paid, cancelled]
        stage:
