# nginx — единственная точка входа (ADR-038, I-06). Только HTTP, локально.
# Один origin для веба и API — CORS не нужен.

# Локальный Next.js dev-прокси меняет Host и передаёт исходный адрес
# в X-Forwarded-Host. Принимаем его только между loopback-адресами.
map "$http_host|$http_x_forwarded_host" $chat_host {
    default $http_host;
    ~*^(?:localhost|127\.0\.0\.1|\[::1\])(?::[0-9]+)?\|((?:localhost|127\.0\.0\.1|\[::1\])(?::[0-9]+)?)$ $1;
}

server {
    # Слушает все интерфейсы: RN на телефоне ходит по IP машины, эмулятор — 10.0.2.2.
    listen 80;
    server_name sto.localhost _;

    # Страховка; 413 в нашем формате отдаёт сам сервис (ADR-029).
    client_max_body_size 4m;

    # Имя gateway резолвится на каждый запрос через DNS Docker, а не один раз
    # при старте: иначе nginx падает, пока Gateway перезапускается.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8080;
    set $web http://web:3000;

    location = /api/chat/events {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $chat_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }

    # API → Gateway. Путь передаётся без изменений (с префиксом /api/);
    # переписывание путей — в Gateway (ADR-028).
    location /api/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # X-Request-Id и заголовки идентичности выставляет только Gateway (ADR-037).
    }

    location / {
        proxy_pass $web;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
