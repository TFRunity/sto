# Локальное окружение v1 (ADR-038). Секреты — только из .env (ADR-011).
# Services подключается на этапе 2 (PLAN.md).
#
# Инварианты:
#   - ports: только у nginx (и Gateway — по желанию в разработке)    ADR-010, ADR-037
#     исключение: инфраструктура — только на 127.0.0.1 для make run  ADR-040
#   - сервис видит только свою БД — отдельная сеть на каждую          ADR-001, I-02
#   - Management UI RabbitMQ наружу не публикуется                    ADR-012

name: sto

x-service: &service
  restart: unless-stopped
  networks: [backend]
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s

x-postgres: &postgres
  image: postgres:18
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  # ── периметр ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
    depends_on:
      gateway:
        condition: service_started

  gateway:
    <<: *service
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL}
      JWT_SECRET: ${JWT_SECRET}
      USERS_URL: http://users:8080
      ORDERS_URL: http://orders:8080
      INVENTORY_URL: http://inventory:8080
      VEHICLE_URL: http://vehicle:8080
    networks: [edge, backend]
    depends_on:
      users:
        condition: service_started
      orders:
        condition: service_started
      inventory:
        condition: service_started
      vehicle:
        condition: service_started
    # ports:
    #   - "8080:8080"   # прямой доступ к Gateway в разработке (ADR-038)

  # ── сервисы ─────────────────────────────────────────────────────────
  users:
    <<: *service
    build:
      context: .
      dockerfile: users/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgres://${USERS_DB_USER}:${USERS_DB_PASSWORD}@users-db:5432/users?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL}
    networks: [backend, users-db]
    depends_on:
      users-db:
        condition: service_healthy

  orders:
    <<: *service
    build:
      context: .
      dockerfile: orders/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgres://${ORDERS_DB_USER}:${ORDERS_DB_PASSWORD}@orders-db:5432/orders?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      INVENTORY_URL: http://inventory:8080
      USERS_URL: http://users:8080
      GOTENBERG_URL: http://gotenberg:3000
    networks: [backend, orders-db]
    # service_started — зависимости в рантайме, не для старта: Orders стартует
    # и без них, но `make up SVC=orders` поднимает всё, что ему нужно.
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory:
        condition: service_started
      users:
        condition: service_started
      gotenberg:
        condition: service_started

  inventory:
    <<: *service
    build:
      context: .
      dockerfile: inventory/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgres://${INVENTORY_DB_USER}:${INVENTORY_DB_PASSWORD}@inventory-db:5432/inventory?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    networks: [backend, inventory-db]
    depends_on:
      inventory-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  vehicle:
    <<: *service
    build:
      context: .
      dockerfile: vehicle/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgres://${VEHICLE_DB_USER}:${VEHICLE_DB_PASSWORD}@vehicle-db:5432/vehicle?sslmode=disable
    networks: [backend, vehicle-db]
    depends_on:
      vehicle-db:
        condition: service_healthy

  # services:         # неделя 2
  #   <<: *service
  #   build:
  #     context: .
  #     dockerfile: services/Dockerfile
  #   environment:
  #     HTTP_ADDR: ":8080"
  #     LOG_LEVEL: ${LOG_LEVEL}
  #     DATABASE_URL: postgres://${SERVICES_DB_USER}:${SERVICES_DB_PASSWORD}@services-db:5432/services?sslmode=disable
  #   networks: [backend, services-db]
  #   depends_on:
  #     services-db:
  #       condition: service_healthy

  # ── базы данных (ADR-001, I-03) ─────────────────────────────────────
  # Postgres 18+: том монтируется в /var/lib/postgresql, НЕ в …/data.
  users-db:
    <<: *postgres
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"   # ADR-040
    volumes:
      - users-db:/var/lib/postgresql
    networks: [users-db]

  orders-db:
    <<: *postgres
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: ${ORDERS_DB_USER}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"   # ADR-040
    volumes:
      - orders-db:/var/lib/postgresql
    networks: [orders-db]

  inventory-db:
    <<: *postgres
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
    ports:
      - "127.0.0.1:5435:5432"   # ADR-040
    volumes:
      - inventory-db:/var/lib/postgresql
    networks: [inventory-db]

  vehicle-db:
    <<: *postgres
    environment:
      POSTGRES_DB: vehicle
      POSTGRES_USER: ${VEHICLE_DB_USER}
      POSTGRES_PASSWORD: ${VEHICLE_DB_PASSWORD}
    volumes:
      - vehicle-db:/var/lib/postgresql
    networks: [vehicle-db]

  # services-db:      # неделя 2
  #   <<: *postgres
  #   environment:
  #     POSTGRES_DB: services
  #     POSTGRES_USER: ${SERVICES_DB_USER}
  #     POSTGRES_PASSWORD: ${SERVICES_DB_PASSWORD}
  #   volumes:
  #     - services-db:/var/lib/postgresql
  #   networks: [services-db]

  # ── инфраструктура ──────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4.3-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"   # ADR-040; 15672 (UI) не публикуется — ADR-012
    configs:
      - source: rabbit_conf
        target: /etc/rabbitmq/conf.d/10-definitions.conf
      - source: rabbit_definitions
        target: /etc/rabbitmq/definitions.json
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # ADR-040
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

# Топология RabbitMQ (ADR-025, А-07; I-05). Пользователь описан здесь же:
# при импорте definitions RABBITMQ_DEFAULT_USER игнорируется.
# Routing key = имя очереди. x-delivery-limit 10 — страховка брокера;
# сервис выбрасывает сообщение после 5 доставок сам.
# Формат проверен запуском на 4.3 (01.11.2026, TODO.md §8).
configs:
  rabbit_conf:
    content: |
      load_definitions = /etc/rabbitmq/definitions.json
  rabbit_definitions:
    content: |
      {
        "users": [
          {"name": "${RABBITMQ_USER}", "password": "${RABBITMQ_PASSWORD}", "tags": ["administrator"]}
        ],
        "vhosts": [{"name": "/"}],
        "permissions": [
          {"user": "${RABBITMQ_USER}", "vhost": "/", "configure": ".*", "write": ".*", "read": ".*"}
        ],
        "exchanges": [
          {"name": "saga_commands", "vhost": "/", "type": "direct", "durable": true, "auto_delete": false, "internal": false, "arguments": {}},
          {"name": "saga_replies",  "vhost": "/", "type": "direct", "durable": true, "auto_delete": false, "internal": false, "arguments": {}}
        ],
        "queues": [
          {"name": "inventory.saga_commands", "vhost": "/", "durable": true, "auto_delete": false,
           "arguments": {"x-queue-type": "quorum", "x-delivery-limit": 10}},
          {"name": "orders.saga_replies", "vhost": "/", "durable": true, "auto_delete": false,
           "arguments": {"x-queue-type": "quorum", "x-delivery-limit": 10}}
        ],
        "bindings": [
          {"source": "saga_commands", "vhost": "/", "destination": "inventory.saga_commands",
           "destination_type": "queue", "routing_key": "inventory.saga_commands", "arguments": {}},
          {"source": "saga_replies", "vhost": "/", "destination": "orders.saga_replies",
           "destination_type": "queue", "routing_key": "orders.saga_replies", "arguments": {}}
        ]
      }

networks:
  edge:
  backend:
  users-db:
  orders-db:
  inventory-db:
  vehicle-db:
  # services-db:

volumes:
  users-db:
  orders-db:
  inventory-db:
  vehicle-db:
  # services-db:
