<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>React Native — экраны СТО — v2</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<style>
:root {
  --surface-2: #ffffff;
  --surface-1: #f5f4f0;
  --surface-0: #ececea;
  --text-primary: #1a1a18;
  --text-secondary: #5f5e5a;
  --text-muted: #888780;
  --border: #d3d1c7;
  --border-strong: #b4b2a9;
  --radius: 8px;
  --bg-accent: #e6f1fb;
  --text-accent: #185fa5;
  --bg-accent-muted: rgba(55,138,221,0.12);
  --fill-accent: #378add;
  --bg-warning: #faeeda;
  --text-warning: #854f0b;
  --bg-success: #eaf3de;
  --text-success: #3b6d11;
  --bg-danger: #fcebeb;
  --text-danger: #a32d2d;
  --fill-primary: #1a1a18;
  --on-primary: #ffffff;
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
}
body { background: var(--surface-0); margin: 0; padding: 40px 20px; color: var(--text-primary); }
h1 { font-size: 22px; font-weight: 500; text-align: center; margin-bottom: 40px; }
.entry { max-width: 900px; margin: 0 auto 64px; }
.entry-title { font-size: 16px; font-weight: 500; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border-strong); }
.layout { display: grid; grid-template-columns: 380px 1fr; gap: 24px; align-items: start; }
.render-frame { background: var(--surface-1); border-radius: 20px; padding: 16px; }
pre { background: #1e1e1c; color: #d4d4d2; padding: 16px; border-radius: 12px; overflow-x: auto; font-size: 12px; line-height: 1.5; max-height: 500px; }
button { font-size: 14px; height: 36px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: transparent; color: var(--text-primary); cursor: pointer; }
input { height: 36px; border-radius: var(--radius); border: 0.5px solid var(--border); padding: 0 12px; background: #fff; color: var(--text-primary); }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>

</html>
