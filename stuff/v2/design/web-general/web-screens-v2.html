<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Веб — экраны СТО — v2</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<style>
:root {
  --surface-2: #ffffff; --surface-1: #f5f4f0; --surface-0: #ececea;
  --text-primary: #1a1a18; --text-secondary: #5f5e5a; --text-muted: #888780;
  --border: #d3d1c7; --border-strong: #b4b2a9; --radius: 8px;
  --bg-accent: #e6f1fb; --text-accent: #185fa5; --bg-accent-muted: rgba(55,138,221,0.12); --fill-accent: #378add;
  --bg-warning: #faeeda; --text-warning: #854f0b;
  --bg-success: #eaf3de; --text-success: #3b6d11;
  --bg-danger: #fcebeb; --text-danger: #a32d2d;
  --fill-primary: #1a1a18; --on-primary: #ffffff;
  --shadow-popover: 0 8px 24px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.08);
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
}
body { background: var(--surface-0); margin: 0; padding: 40px 20px; color: var(--text-primary); }
h1 { font-size: 22px; font-weight: 500; text-align: center; margin-bottom: 40px; }
.entry { max-width: 1100px; margin: 0 auto 64px; }
.entry-title { font-size: 16px; font-weight: 500; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border-strong); }
.layout { display: grid; grid-template-columns: 1fr 420px; gap: 24px; align-items: start; }
.render-frame { background: var(--surface-1); border-radius: 20px; padding: 20px; }
pre { background: #1e1e1c; color: #d4d4d2; padding: 16px; border-radius: 12px; overflow-x: auto; font-size: 11px; line-height: 1.5; max-height: 500px; }
button { font-size: 14px; height: 36px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: transparent; color: var(--text-primary); cursor: pointer; padding: 0 12px; }
input { height: 36px; border-radius: var(--radius); border: 0.5px solid var(--border); padding: 0 12px; background: #fff; color: var(--text-primary); }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<h1>Наметки экранов — веб (директор + клиент) — v2</h1>

<div class="entry"><div class="entry-title">2. Навигация директора — Отчёты открыт</div><div class="layout"><div class="render-frame" id="render-2"></div><pre id="code-2"></pre></div></div>
<div class="entry"><div class="entry-title">6. Чаты (веб-версия)</div><div class="layout"><div class="render-frame" id="render-6"></div><pre id="code-6"></pre></div></div>

<script>
const screens = {};

screens['2'] = `<div style="background:var(--surface-2);border-radius:12px;border:0.5px solid var(--border);padding:0.75rem 1rem;display:flex;align-items:center;gap:8px;position:relative">
<span style="font-size:14px;font-weight:500;padding:8px 12px;border-radius:var(--radius);background:var(--bg-accent);color:var(--text-accent)">Дашборд</span>
<span style="font-size:14px;padding:8px 12px;border-radius:var(--radius);color:var(--text-primary)">Заказы</span>
<div style="position:relative">
<div style="font-size:14px;padding:8px 12px;border-radius:var(--radius);color:var(--text-primary);display:flex;align-items:center;gap:4px;background:var(--surface-1)">Отчёты <i class="ti ti-chevron-down" style="font-size:14px"></i></div>
<div style="position:absolute;top:100%;left:0;margin-top:4px;background:var(--surface-2);border:0.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-popover);min-width:180px;padding:4px;z-index:10">
<div style="padding:8px 10px;font-size:13px;border-radius:6px">Список отчётов</div>
<div style="padding:8px 10px;font-size:13px;border-radius:6px;background:var(--surface-1)">Сотрудники</div>
</div></div>
<span style="font-size:14px;padding:8px 12px;border-radius:var(--radius);color:var(--text-primary)">Каталог</span>
<span style="font-size:14px;padding:8px 12px;border-radius:var(--radius);color:var(--text-primary)">Чат</span>
<div style="flex:1"></div>
<div style="width:32px;height:32px;border-radius:50%;background:var(--bg-accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--text-accent)">Д</div>
</div>
<div style="height:140px"></div>`;

screens['6'] = `<div style="max-width:700px;margin:0 auto">
<div style="background:var(--surface-2);border-radius:12px;border:0.5px solid var(--border);padding:0.75rem 1rem;display:flex;align-items:center;gap:8px;margin-bottom:16px">
<span style="font-size:14px;padding:8px 12px;border-radius:var(--radius);color:var(--text-primary)">Мои заказы</span>
<span style="font-size:14px;padding:8px 12px;border-radius:var(--radius);color:var(--text-primary)">Справки</span>
<span style="font-size:14px;font-weight:500;padding:8px 12px;border-radius:var(--radius);background:var(--bg-accent);color:var(--text-accent)">Чаты</span>
<div style="flex:1"></div>
<div style="width:32px;height:32px;border-radius:50%;background:var(--bg-accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--text-accent)">ИИ</div></div>
<div style="background:var(--surface-2);border-radius:12px;border:0.5px solid var(--border);overflow:hidden;display:grid;grid-template-columns:220px 1fr;min-height:360px">
<div style="border-right:0.5px solid var(--border)">
<div style="padding:16px;border-bottom:0.5px solid var(--border)"><p style="font-weight:500;font-size:16px;margin:0">Чаты</p></div>
<div style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface-1)">
<div style="width:36px;height:36px;border-radius:50%;background:var(--bg-accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--text-accent)">ПС</div>
<div style="flex:1;min-width:0"><p style="font-size:14px;margin:0;font-weight:500">Петров С.А.</p><p style="font-size:12px;color:var(--text-muted);margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Заказ #4521 · закончим к вечеру</p></div></div>
<div style="display:flex;align-items:center;gap:10px;padding:12px 16px">
<div style="width:36px;height:36px;border-radius:50%;background:var(--surface-1);display:flex;align-items:center;justify-content:center"><i class="ti ti-headset" style="font-size:16px;color:var(--text-secondary)"></i></div>
<div style="flex:1;min-width:0"><p style="font-size:14px;margin:0">Поддержка</p><p style="font-size:12px;color:var(--text-muted);margin:1px 0 0">Справка не сформирована</p></div></div></div>
<div style="display:flex;flex-direction:column">
<div style="padding:14px 16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:10px">
<div style="width:32px;height:32px;border-radius:50%;background:var(--bg-accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--text-accent)">ПС</div>
<div><p style="font-size:14px;font-weight:500;margin:0">Петров С.А.</p><p style="font-size:12px;color:var(--text-muted);margin:0">Заказ #4521 · Toyota Camry</p></div></div>
<div style="flex:1;padding:16px;display:flex;flex-direction:column;gap:10px">
<div style="align-self:flex-start;max-width:70%"><div style="background:var(--surface-1);border-radius:14px 14px 14px 4px;padding:10px 14px"><p style="font-size:14px;margin:0">Добрый день! Меняем тормозные колодки, закончим сегодня к вечеру</p></div><p style="font-size:11px;color:var(--text-muted);margin:4px 0 0">10:25</p></div>
<div style="align-self:flex-end;max-width:70%"><div style="background:var(--bg-accent-muted);border-radius:14px 14px 4px 14px;padding:10px 14px"><p style="font-size:14px;margin:0">Спасибо, буду ждать</p></div><p style="font-size:11px;color:var(--text-muted);margin:4px 0 0;text-align:right">10:41</p></div>
</div>
<div style="padding:12px 16px;border-top:0.5px solid var(--border);display:flex;gap:8px">
<input placeholder="Сообщение" style="flex:1"/>
<button style="width:40px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--fill-primary);border:none"><i class="ti ti-send" style="font-size:16px;color:var(--on-primary)"></i></button>
</div></div></div></div>`;

for (const key in screens) {
  document.getElementById('render-' + key).innerHTML = screens[key];
  document.getElementById('code-' + key).textContent = screens[key];
}
</script>
</body>
</html>
