# sqlc для Users (ADR-024). Запуск — make generate MODULE=users.
# Схема читается из миграций goose (секции Up); код коммитится, CI проверяет дифф.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: db
        out: internal/db           # модели не выходят за пределы репозитория (ADR-024)
        sql_package: pgx/v5
        emit_pointers_for_null_types: true   # nullable text/int → *string, *int32
        overrides:                 # ADR-026; numeric → decimal — у сервисов с деньгами
          # Только типы колонок таблицы users; другим сервисам — в их sqlc.yaml.
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          # Под pgx/v5 время по умолчанию — pgtype.*, даже у NOT NULL; переводим в time.
          - db_type: timestamptz           # created_at, updated_at
            go_type: time.Time
          - db_type: timestamptz           # deleted_at
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: date                  # work_started_at
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
